name: check

# Free checks only. Model-call evals run locally (see README).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate cards, index and fixture
        run: python3 tools/cards.py check
      - name: Unit tests
        run: python3 -m unittest discover tests
